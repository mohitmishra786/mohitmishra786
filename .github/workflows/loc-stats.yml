name: LOC Stats - All Repositories

on:
  schedule:
    - cron: '30 1 * * *'  # daily 01:30 UTC (staggered from the other README writers)
  workflow_dispatch:

permissions: {}

# Shared by every workflow that commits to this repo, so they never race on `git push`.
concurrency:
  group: profile-readme-writer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  count-loc:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write  # commit loc_results/ and README.md
    env:
      OWNER: ${{ github.repository_owner }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq cloc
          python -m pip install --quiet -r scripts/requirements.txt

      - name: Read LOC config
        run: |
          set -euo pipefail
          python - <<'EOF'
          import yaml
          loc = yaml.safe_load(open(".github/profile-config.yml"))["loc"]
          open("/tmp/loc_exclude.txt", "w").write("\n".join(loc.get("exclude_repos", [])) + "\n")
          open("/tmp/loc_exclude_langs.txt", "w").write(",".join(loc["exclude_langs"]))
          open("/tmp/loc_not_match_d.txt", "w").write(loc["not_match_d"])
          EOF

      - name: List own public repositories
        env:
          # Public data only: GITHUB_TOKEN can't see private repos, and the filter
          # below drops private, forked, archived and non-owned repos anyway.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh api --paginate "users/${OWNER}/repos?type=owner&per_page=100" \
            --jq ".[] | select(.private == false and .fork == false and .archived == false and .owner.login == \"${OWNER}\") | {full_name, clone_url, size}" \
            > /tmp/repos.jsonl
          jq -s '[.[].full_name]' /tmp/repos.jsonl > /tmp/loc_allowlist.json
          echo "Public, owned, non-fork, non-archived repositories: $(jq length /tmp/loc_allowlist.json)"

      - name: Clone and count each repository
        run: |
          set -euo pipefail
          mkdir -p loc_results loc_logs /tmp/all_repos
          echo "Repository,Language,Files,Blank,Comment,Code" > loc_results/detailed_results.csv
          echo "Repository,Status,Reason" > loc_logs/repo_status.csv
          exclude_langs=$(cat /tmp/loc_exclude_langs.txt)
          not_match_d=$(cat /tmp/loc_not_match_d.txt)

          status() { printf '%s,%s,%s\n' "$1" "$2" "$(printf '%s' "${3:-}" | tr ',\n' '; ' | cut -c1-200)" >> loc_logs/repo_status.csv; }

          while IFS=$'\t' read -r full clone size; do
            if grep -qixF -- "$full" /tmp/loc_exclude.txt; then
              status "$full" excluded "listed in loc.exclude_repos"; continue
            fi
            if [ "$size" -eq 0 ]; then
              status "$full" empty "repository has no commits"; continue
            fi
            dir="/tmp/all_repos/${full#*/}"
            if ! err=$(git clone --depth 1 --quiet "$clone" "$dir" 2>&1); then
              status "$full" failed "clone: $err"; continue
            fi
            if ! err=$(cloc "$dir" --json --quiet --exclude-lang="$exclude_langs" \
                         --fullpath --not-match-d="$not_match_d" --out=/tmp/cloc.json 2>&1); then
              status "$full" failed "cloc: $err"; rm -rf "$dir" /tmp/cloc.json; continue
            fi
            if [ ! -s /tmp/cloc.json ]; then
              status "$full" empty "no countable source files"; rm -rf "$dir"; continue
            fi
            jq -r --arg repo "$full" \
              'del(.header, .SUM) | to_entries[]
               | [$repo, .key, .value.nFiles, .value.blank, .value.comment, .value.code]
               | map(tostring) | join(",")' /tmp/cloc.json >> loc_results/detailed_results.csv
            status "$full" ok ""
            rm -rf "$dir" /tmp/cloc.json
          done < <(jq -r '[.full_name, .clone_url, (.size | tostring)] | @tsv' /tmp/repos.jsonl)

          echo "Status counts:"; tail -n +2 loc_logs/repo_status.csv | cut -d, -f2 | sort | uniq -c

      - name: Lines changed in merged PRs to other repositories
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/contributions.py lines --out loc_results/contrib_lines.csv

      - name: Build reports and update README
        run: |
          set -euo pipefail
          python scripts/loc_report.py \
            --allowlist /tmp/loc_allowlist.json \
            --status loc_logs/repo_status.csv \
            --contrib loc_results/contrib_lines.csv \
            --readme README.md
          cat loc_results/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results and per-repo status log
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6.0.0
        with:
          name: loc-statistics
          path: |
            loc_results/
            loc_logs/
          retention-days: 90

      - name: Commit and push
        run: scripts/commit_and_push.sh "update LOC statistics" README.md loc_results

name: Generate Snake Animation

on:
  schedule:
    - cron: '15 */12 * * *'  # every 12 hours at :15 (staggered from the other README writers)
  workflow_dispatch:

permissions: {}

concurrency:
  group: profile-readme-writer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write  # commit the generated SVGs
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Generate snake SVGs (light and dark)
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b  # v3.5.0
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/github-snake.svg
            assets/github-snake-dark.svg?palette=github-dark

      - name: Commit and push
        run: scripts/commit_and_push.sh "update snake animation" assets/github-snake.svg assets/github-snake-dark.svg

name: GitHub-Profile-3D-Contrib

on:
  schedule:
    - cron: '0 18 * * *'  # daily 18:00 UTC
  workflow_dispatch:

permissions: {}

concurrency:
  group: profile-readme-writer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: generate-github-profile-3d-contrib
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write  # commit assets/profile-3d-contrib
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Generate 3D contribution graphs
        uses: yoshi389111/github-profile-3d-contrib@b36be1e5eca859f05c94f1d3f0c9391ea2d2aeb4  # 0.2.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Move to assets
        run: |
          set -euo pipefail
          mkdir -p assets/profile-3d-contrib
          mv profile-3d-contrib/* assets/profile-3d-contrib/
          rm -rf profile-3d-contrib

      - name: Commit and push
        run: scripts/commit_and_push.sh "update 3D contribution graph" assets/profile-3d-contrib
